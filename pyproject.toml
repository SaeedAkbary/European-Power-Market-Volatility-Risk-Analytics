[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "power-risk"
version = "0.2.0"
description = "Reproducible German electricity market volatility and risk research"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "requests>=2.32,<3", "pyarrow>=17", "scikit-learn>=1.5,<2", "scipy>=1.11", "matplotlib>=3.9", "streamlit>=1.40", "holidays>=0.60", "entsoe-py>=0.6.18", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
parquet-fallback = ["fastparquet>=2024.11"]
presentation = ["reportlab>=4", "pypdf>=5", "pymupdf>=1.24", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
power-risk = "power_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

